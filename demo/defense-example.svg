<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Кадр → объекты → решение</title>
  <desc id="desc">Три вымышленных примера: лёгкий пластик, тяжёлый камень и стекло с пропусками глубины. Это не инференс и не данные соревнования.</desc>
  <defs>
    <pattern id="floor" width="55" height="38" patternUnits="userSpaceOnUse">
      <rect width="55" height="38" fill="#15273b"/>
      <path d="M55 0H0V38" fill="none" stroke="#2e455b" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#020a14"/>
  <g font-family="Arial, sans-serif" fill="#f2f6fb">
    <text x="60" y="68" font-size="20" font-weight="bold" fill="#8dedf9">ASTRAMIS  /  РЕЗЕРВНОЕ ДЕМО</text>
    <text x="60" y="139" font-size="53" font-weight="bold">Кадр → объекты → решение</text>
    <text x="60" y="188" font-size="28" fill="#aabdd0">Условные сцены: не кадры датасета и не результаты инференса.</text>
    <g transform="translate(60 223)">
      <rect width="368" height="379" fill="#0b1829"/>
      <rect x="16" y="16" width="336" height="192" fill="url(#floor)"/>
      <rect x="116" y="67" width="141" height="91" fill="none" stroke="#c1f229" stroke-width="3"/>
      <g transform="translate(188 113) rotate(-18)">
        <path d="M-49 -25H30L44 -10H53V10H44L30 25H-49Q-58 25 -58 16V-16Q-58 -25 -49 -25Z" fill="#437dba" stroke="#8dedf9" stroke-width="3"/>
        <path d="M-36 -18V18M-19 -18V18" stroke="#8dedf9" stroke-width="3"/>
      </g>
      <text x="20" y="251" font-size="29" font-weight="bold">Лёгкий пластик</text>
      <text x="20" y="296" font-size="25" fill="#aabdd0">Условная масса: ≤ 500 г</text>
      <text x="20" y="346" font-size="28" font-weight="bold" fill="#c1f229">Убрать · take = 1</text>
    </g>
    <g transform="translate(456 223)">
      <rect width="368" height="379" fill="#0b1829"/>
      <rect x="16" y="16" width="336" height="192" fill="url(#floor)"/>
      <rect x="115" y="64" width="143" height="97" fill="none" stroke="#ffb52e" stroke-width="3"/>
      <path d="M125 133L147 91 177 73 226 85 245 113 239 146 169 151Z" fill="#8a8d9c" stroke="#bbc8d5" stroke-width="3"/>
      <path d="M147 91L176 109 226 85M176 109L169 151M125 133L176 109 239 146" fill="none" stroke="#515464" stroke-width="3"/>
      <text x="20" y="251" font-size="29" font-weight="bold">Тяжёлый камень</text>
      <text x="20" y="296" font-size="25" fill="#aabdd0">Условная масса: &gt; 500 г</text>
      <text x="20" y="346" font-size="28" font-weight="bold" fill="#ffb52e">Объехать · take = 0</text>
    </g>
    <g transform="translate(852 223)">
      <rect width="368" height="379" fill="#0b1829"/>
      <rect x="16" y="16" width="336" height="192" fill="url(#floor)"/>
      <rect x="119" y="56" width="129" height="118" fill="none" stroke="#b8b1ff" stroke-width="3" stroke-dasharray="8 5"/>
      <path d="M140 78L153 155Q184 165 214 155L227 78M140 78Q183 60 227 78Q185 95 140 78" fill="#8dedf9" fill-opacity=".17" stroke="#8dedf9" stroke-width="3"/>
      <path d="M158 99H180V121H158zM189 108H211V130H189zM174 132H196V154H174z" fill="#020a14"/>
      <text x="20" y="251" font-size="29" font-weight="bold">Стекло и пропуски</text>
      <text x="20" y="296" font-size="25" fill="#aabdd0">Чёрное — нет глубины</text>
      <text x="20" y="346" font-size="26" font-weight="bold" fill="#b8b1ff">Риск ошибки объёма</text>
    </g>
    <text x="60" y="661" font-size="22" fill="#aabdd0">Рамка условна; масса и действие показаны по правилу кейса. Источник порога: BRIEF.md.</text>
  </g>
</svg>
